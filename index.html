<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f3ed">
<title>小小心愿 — 生日礼物清单</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap');
:root{--ink:#24251f;--muted:#76776d;--paper:#f7f3ed;--white:#fffefa;--line:#e8e2d8;--green:#385f4a;--mint:#e6efe8;--coral:#d1785d;--gold:#c8a96b;--shadow:0 16px 50px #41352212}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans','PingFang SC',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.serif{font-family:'Noto Serif SC',serif}.topbar{height:70px;padding:0 max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-family:'Noto Serif SC',serif;font-weight:700;font-size:19px;letter-spacing:.04em}.brand span{color:var(--coral)}.topnote{font-size:12px;color:var(--muted)}main{max-width:1060px;padding:48px 24px 90px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:30px;gap:20px}.eyebrow{text-transform:uppercase;letter-spacing:.19em;font-size:10px;color:var(--coral);font-weight:700}.hero h1{font:600 clamp(30px,5vw,44px)/1.2 'Noto Serif SC',serif;margin:9px 0 10px}.hero p{color:var(--muted);margin:0;font-size:14px}.hero-art{font-size:52px;transform:rotate(-8deg);filter:drop-shadow(0 9px 10px #d7b98b44)}.panel{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px}.center{max-width:650px;margin:30px auto}.center .panel{padding:36px}.section-title{font:600 22px 'Noto Serif SC',serif;margin:0 0 7px}.sub{color:var(--muted);font-size:13px;line-height:1.65;margin:0 0 24px}.field{margin:16px 0}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:8px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:13px 14px;outline:none;color:var(--ink);transition:.2s}.field input:focus,.field textarea:focus,.field select:focus{border-color:#82a48d;box-shadow:0 0 0 3px #e6efe8}.field textarea{min-height:76px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:10px;background:var(--green);color:white;font-weight:600;padding:13px 18px;transition:.2s}.btn:hover{background:#294a38;transform:translateY(-1px)}.btn.block{width:100%;margin-top:8px}.btn.light{background:var(--mint);color:var(--green)}.btn.light:hover{background:#d5e5d9}.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}.btn.small{padding:8px 11px;font-size:12px;border-radius:8px}.linkbar{margin-top:14px;padding:13px;border:1px dashed #d9d1c5;border-radius:11px;display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:12px;color:var(--muted);overflow-wrap:anywhere}.linkbar code{font-family:monospace;color:var(--ink)}.wish-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:21px;border-bottom:1px solid var(--line);margin-bottom:22px}.wish-head h2{font:600 27px 'Noto Serif SC',serif;margin:0 0 8px}.wish-meta{font-size:13px;color:var(--muted)}.wish-meta b{color:var(--green)}.actions{display:flex;gap:9px;flex-wrap:wrap}.budget-strip{display:flex;gap:12px;align-items:center;background:#f1f5ef;padding:13px 16px;border-radius:12px;margin-bottom:18px;font-size:13px}.budget-strip strong{color:var(--green)}.budget-strip .spacer{flex:1}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;padding:12px 14px;border-bottom:1px solid var(--line)}.table td{padding:16px 14px;border-bottom:1px solid #f0ece5;font-size:13px;vertical-align:middle}.table tr:last-child td{border-bottom:0}.gift-name{font-weight:700;font-size:14px}.gift-note{font-size:11px;color:var(--muted);margin-top:5px}.price{font-weight:600;white-space:nowrap}.status{display:flex;align-items:center;gap:9px}.pill{font-size:11px;border-radius:20px;padding:6px 10px;background:#f3eee5;color:#846c45;white-space:nowrap}.pill.ready{background:#e6efe8;color:#42664e}.pill.taken{background:#f8e8e2;color:#a45139}.pill.thanks{background:#e8eafb;color:#565f9f}.pill.received{background:#f1eee7;color:#746b5a}.tools{display:flex;gap:6px;justify-content:flex-end}.gift-form{margin-top:22px;padding:20px;background:#faf8f3;border-radius:14px}.gift-form h3{font:600 16px 'Noto Serif SC',serif;margin:0 0 8px}.empty{text-align:center;padding:45px 15px;color:var(--muted);font-size:13px}.empty .emoji{font-size:31px;margin-bottom:8px}.owner-foot{margin-top:20px;color:var(--muted);font-size:11px;line-height:1.6}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#252821;color:white;padding:12px 18px;border-radius:10px;font-size:13px;transition:.25s;z-index:4}.toast.show{opacity:1;transform:translate(-50%,0)}.error{color:#ad4935;font-size:12px;margin-top:7px}.modal-bg{position:fixed;inset:0;background:#24251f66;display:grid;place-items:center;padding:20px;z-index:3}.modal{max-width:450px;width:100%;background:var(--white);border-radius:18px;padding:25px;box-shadow:var(--shadow)}.detail-list{font-size:13px;color:var(--muted);line-height:1.8}.detail-list a{color:var(--green)}.footer{text-align:center;color:#96958b;font-size:11px;margin-top:34px}@media(max-width:650px){main{padding:31px 15px 60px}.topbar{height:60px;padding:0 17px}.hero{margin-bottom:20px}.hero-art{font-size:39px}.panel,.center .panel{padding:22px 17px}.center{margin:18px auto}.wish-head{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.table th,.table td{padding:13px 7px}.table th{font-size:10px}.table td{font-size:12px}.gift-name{font-size:12px}.gift-note{display:none}.tools{flex-direction:column}.row{grid-template-columns:1fr;gap:0}.budget-strip{flex-wrap:wrap}.table-wrap{overflow-x:auto}.table{min-width:500px}}
</style></head>
<body><header class="topbar"><div class="brand">小小<span>心愿</span></div><div class="topnote">一份心意，刚刚好</div></header><main id="app"></main><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script></body></html>
