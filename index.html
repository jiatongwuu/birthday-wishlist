<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f3ed">
<title>小小心愿 — 生日礼物清单</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap');
:root{--ink:#24251f;--muted:#76776d;--paper:#f7f3ed;--white:#fffefa;--line:#e8e2d8;--green:#385f4a;--mint:#e6efe8;--coral:#d1785d;--gold:#c8a96b;--shadow:0 16px 50px #41352212}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans','PingFang SC',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.serif{font-family:'Noto Serif SC',serif}.topbar{height:70px;padding:0 max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-family:'Noto Serif SC',serif;font-weight:700;font-size:19px;letter-spacing:.04em}.brand span{color:var(--coral)}.topnote{font-size:12px;color:var(--muted)}main{max-width:1060px;padding:48px 24px 90px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:30px;gap:20px}.eyebrow{text-transform:uppercase;letter-spacing:.19em;font-size:10px;color:var(--coral);font-weight:700}.hero h1{font:600 clamp(30px,5vw,44px)/1.2 'Noto Serif SC',serif;margin:9px 0 10px}.hero p{color:var(--muted);margin:0;font-size:14px}.hero-art{font-size:52px;transform:rotate(-8deg);filter:drop-shadow(0 9px 10px #d7b98b44)}.panel{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px}.center{max-width:650px;margin:30px auto}.center .panel{padding:36px}.section-title{font:600 22px 'Noto Serif SC',serif;margin:0 0 7px}.sub{color:var(--muted);font-size:13px;line-height:1.65;margin:0 0 24px}.field{margin:16px 0}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:8px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:13px 14px;outline:none;color:var(--ink);transition:.2s}.field input:focus,.field textarea:focus,.field select:focus{border-color:#82a48d;box-shadow:0 0 0 3px #e6efe8}.field textarea{min-height:76px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:10px;background:var(--green);color:white;font-weight:600;padding:13px 18px;transition:.2s}.btn:hover{background:#294a38;transform:translateY(-1px)}.btn.block{width:100%;margin-top:8px}.btn.light{background:var(--mint);color:var(--green)}.btn.light:hover{background:#d5e5d9}.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}.btn.small{padding:8px 11px;font-size:12px;border-radius:8px}.linkbar{margin-top:14px;padding:13px;border:1px dashed #d9d1c5;border-radius:11px;display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:12px;color:var(--muted);overflow-wrap:anywhere}.linkbar code{font-family:monospace;color:var(--ink)}.wish-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:21px;border-bottom:1px solid var(--line);margin-bottom:22px}.wish-head h2{font:600 27px 'Noto Serif SC',serif;margin:0 0 8px}.wish-meta{font-size:13px;color:var(--muted)}.wish-meta b{color:var(--green)}.actions{display:flex;gap:9px;flex-wrap:wrap}.budget-strip{display:flex;gap:12px;align-items:center;background:#f1f5ef;padding:13px 16px;border-radius:12px;margin-bottom:18px;font-size:13px}.budget-strip strong{color:var(--green)}.budget-strip .spacer{flex:1}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;padding:12px 14px;border-bottom:1px solid var(--line)}.table td{padding:16px 14px;border-bottom:1px solid #f0ece5;font-size:13px;vertical-align:middle}.table tr:last-child td{border-bottom:0}.gift-name{font-weight:700;font-size:14px}.gift-note{font-size:11px;color:var(--muted);margin-top:5px}.price{font-weight:600;white-space:nowrap}.status{display:flex;align-items:center;gap:9px}.pill{font-size:11px;border-radius:20px;padding:6px 10px;background:#f3eee5;color:#846c45;white-space:nowrap}.pill.ready{background:#e6efe8;color:#42664e}.pill.taken{background:#f8e8e2;color:#a45139}.pill.thanks{background:#e8eafb;color:#565f9f}.pill.received{background:#f1eee7;color:#746b5a}.tools{display:flex;gap:6px;justify-content:flex-end}.gift-form{margin-top:22px;padding:20px;background:#faf8f3;border-radius:14px}.gift-form h3{font:600 16px 'Noto Serif SC',serif;margin:0 0 8px}.empty{text-align:center;padding:45px 15px;color:var(--muted);font-size:13px}.empty .emoji{font-size:31px;margin-bottom:8px}.owner-foot{margin-top:20px;color:var(--muted);font-size:11px;line-height:1.6}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#252821;color:white;padding:12px 18px;border-radius:10px;font-size:13px;transition:.25s;z-index:4}.toast.show{opacity:1;transform:translate(-50%,0)}.error{color:#ad4935;font-size:12px;margin-top:7px}.modal-bg{position:fixed;inset:0;background:#24251f66;display:grid;place-items:center;padding:20px;z-index:3}.modal{max-width:450px;width:100%;background:var(--white);border-radius:18px;padding:25px;box-shadow:var(--shadow)}.detail-list{font-size:13px;color:var(--muted);line-height:1.8}.detail-list a{color:var(--green)}.footer{text-align:center;color:#96958b;font-size:11px;margin-top:34px}@media(max-width:650px){main{padding:31px 15px 60px}.topbar{height:60px;padding:0 17px}.hero{margin-bottom:20px}.hero-art{font-size:39px}.panel,.center .panel{padding:22px 17px}.center{margin:18px auto}.wish-head{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.table th,.table td{padding:13px 7px}.table th{font-size:10px}.table td{font-size:12px}.gift-name{font-size:12px}.gift-note{display:none}.tools{flex-direction:column}.row{grid-template-columns:1fr;gap:0}.budget-strip{flex-wrap:wrap}.table-wrap{overflow-x:auto}.table{min-width:500px}}
</style></head>
<body><header class="topbar"><div class="brand">小小<span>心愿</span></div><div class="topnote">一份心意，刚刚好</div></header><main id="app"></main><div id="toast" class="toast"></div><script>
const KEY='littleWish_v1',app=document.querySelector('#app');let db=readDB(),timer;
function readDB(){try{return JSON.parse(localStorage.getItem(KEY)||'{"lists":[]}')}catch{return{lists:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2})}function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2200)}function qp(k){return new URLSearchParams(location.search).get(k)}function baseURL(){return location.href.split('?')[0]}function listById(id){return db.lists.find(x=>x.id===id)}function go(q=''){history.pushState({},'',baseURL()+q);render()}onpopstate=render;
function shell(title,desc,content){app.innerHTML=`<div class="hero"><div><div class="eyebrow">A LITTLE WISH</div><h1>${title}</h1><p>${desc}</p></div><div class="hero-art">🎂</div></div>${content}<div class="footer">用心挑选，快乐庆祝 ✦ 小小心愿</div>`}
function render(){db=readDB();let id=qp('id'),mode=qp('mode'),l=id&&listById(id);if(!id){if(db.lists.length)landing();else createPage();return}if(!l){app.innerHTML='<div class="center panel">找不到这份心愿单。<button class="btn block" onclick="go(\'\')">回到首页</button></div>';return}if(mode==='manage'){if(qp('key')!==l.key){adminGate(l);return}adminPage(l)}else visitorPage(l)}
function createPage(){shell('把喜欢的礼物，<br>变成一份小小心愿','创建生日心愿单，分享给朋友，收下真正喜欢的礼物。',`<div class="center"><div class="panel"><h2 class="section-title">先从你的名字开始</h2><p class="sub">不用注册账号，创建后会得到专属管理链接和访客链接。</p><div class="field"><label>你的昵称</label><input id="owner" placeholder="例如：小满"></div><button class="btn block" onclick="createList()">创建我的心愿单 <span>→</span></button><div class="owner-foot">管理链接仅保存在你当前设备，请妥善保存；任何人持有链接都可访问相应页面。</div></div></div>`)}
function landing(){let rows=db.lists.slice().reverse().map(l=>`<div class="linkbar"><span><b>${esc(l.owner)}</b> · ${esc(l.title)}</span><button class="btn small light" onclick="openManage('${l.id}')">打开管理</button></div>`).join('');shell('让心意，<br>送到刚刚好','你的生日心愿单都在这里。',`<div class="panel"><h2 class="section-title">我的心愿单</h2>${rows}<button class="btn block" onclick="go('')">＋ 创建新的心愿单</button></div>`)}
function createList(){let owner=document.querySelector('#owner').value.trim();if(!owner){toast('请先填写昵称');return}let l={id:crypto.randomUUID(),key:crypto.randomUUID().replaceAll('-',''),owner,title:owner+'的生日心愿单',birthday:'',items:[],created:Date.now()};db.lists.push(l);save();go(`?id=${l.id}&mode=manage&key=${l.key}`)}function openManage(id){let l=listById(id);go(`?id=${id}&mode=manage&key=${l.key}`)}
function adminGate(l){shell('管理你的心愿单','请输入管理口令继续。',`<div class="center"><div class="panel"><h2 class="section-title">管理验证</h2><p class="sub">管理链接里的口令可用于验证身份。</p><div class="field"><label>管理口令</label><input id="adminKey" placeholder="粘贴管理口令"></div><button class="btn block" onclick="checkKey('${l.id}')">进入管理</button><div class="linkbar"><span>心愿主：${esc(l.owner)}</span><button class="btn small light" onclick="go('?id=${l.id}')">访客浏览</button></div></div></div>`)}function checkKey(id){let k=document.querySelector('#adminKey').value;if(k===listById(id).key)go(`?id=${id}&mode=manage&key=${k}`);else toast('口令不正确')}
function adminPage(l){let items=l.items.map((it,i)=>`<tr><td><div class="gift-name">${esc(it.name)}</div>${it.note?`<div class="gift-note">${esc(it.note)}</div>`:''}</td><td class="price">${money(it.price)}</td><td><span class="pill ${it.state==='received'?'received':it.state==='taken'?'taken':'ready'}">${it.state==='received'?'已收到':it.state==='taken'?'已拍下 · '+esc(it.taker):'未拍下'}</span>${it.state==='received'?`<div class="gift-note">已感谢 ${esc(it.taker||'')}</div>`:''}</td><td><div class="tools"><button class="btn small ghost" onclick="editItem('${l.id}','${it.id}')">编辑</button>${it.state!=='received'?`<button class="btn small light" onclick="toggleReceived('${l.id}','${it.id}')">已收到</button>`:`<button class="btn small light" onclick="toggleReceived('${l.id}','${it.id}')">撤回</button>`}<button class="btn small ghost" onclick="deleteItem('${l.id}','${it.id}')">删除</button></div></td></tr>`).join('');shell('生日心愿单','编辑清单，分享给朋友，记录每一份心意。',`<div class="panel"><div class="wish-head"><div><h2>${esc(l.title)}</h2><div class="wish-meta">心愿主 <b>${esc(l.owner)}</b> ${l.birthday?'· 生日 '+esc(l.birthday):''}</div></div><div class="actions"><button class="btn light" onclick="copyLink('${l.id}')">复制访客链接</button><button class="btn ghost" onclick="editList('${l.id}')">设置</button></div></div><div class="linkbar"><span>访客链接　<code>${esc(baseURL())}?id=${l.id}</code></span><button class="btn small light" onclick="copyLink('${l.id}')">复制</button></div><div class="linkbar"><span>管理链接　<code>${esc(baseURL())}?id=${l.id}&amp;mode=manage&amp;key=${l.key}</code></span><button class="btn small ghost" onclick="copyManage('${l.id}')">复制</button></div><div class="table-wrap"><table class="table"><thead><tr><th>礼物名称</th><th>预估金额</th><th>是否拍下</th><th></th></tr></thead><tbody>${items||`<tr><td colspan="4"><div class="empty"><div class="emoji">🎁</div>添加几件喜欢的礼物，朋友就知道从哪里开始啦。</div></td></tr>`}</tbody></table></div><div class="gift-form"><h3 id="formTitle">添加一件心愿</h3><input type="hidden" id="editId"><div class="row"><div class="field"><label>礼物名称 *</label><input id="giftName" placeholder="例如：陶土手作咖啡杯"></div><div class="field"><label>预估金额 *</label><input id="giftPrice" type="number" min="0" step="0.01" placeholder="例如：168"></div></div><div class="row"><div class="field"><label>购买链接（可选）</label><input id="giftUrl" placeholder="https://"></div><div class="field"><label>图片链接（可选）</label><input id="giftImage" placeholder="https://"></div></div><div class="row"><div class="field"><label>备注（可选）</label><input id="giftNote" placeholder="颜色、尺寸或其他偏好"></div><div class="field"><label>优先级（可选）</label><select id="giftPriority"><option value="">不指定</option><option>最想要</option><option>喜欢</option><option>随缘</option></select></div></div><button class="btn" onclick="saveItem('${l.id}')">保存心愿</button> <button class="btn ghost" onclick="resetForm()">清空</button></div><p class="owner-foot">状态顺序：未拍下 → 已拍下 → 已收到。你可以撤回状态或移除条目。</p></div>`)}
function visitorPage(l){let anonKey='wish_anon_'+l.id,anonId=localStorage.getItem(anonKey);if(!anonId){anonId=crypto.randomUUID();localStorage.setItem(anonKey,anonId)}let rows=l.items.map(it=>{let status=it.state==='received'?`<span class="pill thanks">已感谢</span>`:it.state==='taken'?`<span class="pill taken">已拍下</span>`:`<span class="pill ready">未拍下</span>`;let action=it.state==='open'?`<button class="btn small" onclick="takeGift('${l.id}','${it.id}')">拍下</button>`:it.state==='taken'&&it.takerId===anonId?`<button class="btn small ghost" onclick="undoTake('${l.id}','${it.id}')">撤销拍下</button>`:'';return `<tr><td><div class="gift-name" onclick="showDetail('${l.id}','${it.id}')" style="cursor:pointer">${esc(it.name)} <span style="color:#b2a38c;font-size:10px">详情 ↗</span></div>${it.note?`<div class="gift-note">${esc(it.note)}</div>`:''}</td><td class="price">${money(it.price)}</td><td><div class="status">${status}${action}</div></td></tr>`}).join('');shell('一份生日心愿，<br>等你来挑选','浏览喜欢的礼物，拍下或撤销都无需填写个人信息。',`<div class="panel"><div class="wish-head"><div><h2>${esc(l.title)}</h2><div class="wish-meta">心愿主 <b>${esc(l.owner)}</b> ${l.birthday?'· 生日 '+esc(l.birthday):''}</div></div><button class="btn light" onclick="copyLink('${l.id}')">分享链接</button></div><div class="table-wrap"><table class="table"><thead><tr><th>礼物名称</th><th>预估金额</th><th>是否拍下</th></tr></thead><tbody>${rows||`<tr><td colspan="3"><div class="empty"><div class="emoji">🌱</div>心愿主还在准备清单。</div></td></tr>`}</tbody></table></div><p class="owner-foot">拍下状态仅显示“已拍下”，不会公开拍下者信息。你可在本设备撤销自己拍下的礼物。</p></div>`)}
function takeGift(id,itemId){let l=listById(id),it=l.items.find(x=>x.id===itemId);if(it.state!=='open')return toast('这件礼物已经被拍下');let anonId=localStorage.getItem('wish_anon_'+id);it.state='taken';it.taker='匿名访客';it.takerId=anonId;it.takenAt=Date.now();save();render();toast('已拍下')}
function undoTake(id,itemId){let it=listById(id).items.find(x=>x.id===itemId),anonId=localStorage.getItem('wish_anon_'+id);if(it.state!=='taken'||it.takerId!==anonId)return toast('只能撤销本设备拍下的礼物');it.state='open';it.taker='';it.takerId='';it.takenAt=null;save();render();toast('已撤销拍下')}
function saveItem(id){let l=listById(id),eid=document.querySelector('#editId').value,name=document.querySelector('#giftName').value.trim(),price=document.querySelector('#giftPrice').value;if(!name||price===''){toast('请填写礼物名称和预估金额');return}let data={name,price:Number(price),url:document.querySelector('#giftUrl').value.trim(),image:document.querySelector('#giftImage').value.trim(),note:document.querySelector('#giftNote').value.trim(),priority:document.querySelector('#giftPriority').value};if(eid)Object.assign(l.items.find(x=>x.id===eid),data);else l.items.push({id:crypto.randomUUID(),...data,state:'open'});save();render();toast(eid?'已更新心愿':'已添加心愿')}function editItem(id,itemId){let it=listById(id).items.find(x=>x.id===itemId);document.querySelector('#editId').value=it.id;document.querySelector('#giftName').value=it.name;document.querySelector('#giftPrice').value=it.price;document.querySelector('#giftUrl').value=it.url||'';document.querySelector('#giftImage').value=it.image||'';document.querySelector('#giftNote').value=it.note||'';document.querySelector('#giftPriority').value=it.priority||'';document.querySelector('#formTitle').textContent='编辑心愿';document.querySelector('.gift-form').scrollIntoView({behavior:'smooth'})}function resetForm(){['editId','giftName','giftPrice','giftUrl','giftImage','giftNote'].forEach(id=>document.querySelector('#'+id).value='');document.querySelector('#giftPriority').value='';document.querySelector('#formTitle').textContent='添加一件心愿'}function deleteItem(id,itemId){if(!confirm('确定移除这件心愿？'))return;let l=listById(id);l.items=l.items.filter(x=>x.id!==itemId);save();render()}function toggleReceived(id,itemId){let it=listById(id).items.find(x=>x.id===itemId);it.state=it.state==='received'?'open':'received';if(it.state==='open'){it.taker='';it.takenAt=null}save();render()}function editList(id){let l=listById(id),title=prompt('心愿单标题',l.title);if(title===null)return;if(title.trim())l.title=title.trim();let date=prompt('生日日期（可留空，格式 YYYY-MM-DD）',l.birthday||'');if(date!==null)l.birthday=date;save();render()}
function copyLink(id){copyText(baseURL()+'?id='+id)}function copyManage(id){let l=listById(id);copyText(baseURL()+`?id=${id}&mode=manage&key=${l.key}`)}async function copyText(t){try{await navigator.clipboard.writeText(t);toast('链接已复制')}catch{prompt('复制以下链接',t)}}function showDetail(id,itemId){let it=listById(id).items.find(x=>x.id===itemId);let bg=document.createElement('div');bg.className='modal-bg';bg.onclick=e=>{if(e.target===bg)bg.remove()};bg.innerHTML=`<div class="modal"><div class="eyebrow">WISH DETAILS</div><h2 class="section-title" style="margin-top:8px">${esc(it.name)}</h2><p class="sub">${it.priority?'✦ '+esc(it.priority):'心愿详情'}</p>${it.image?`<img src="${esc(it.image)}" alt="礼物图片" style="max-width:100%;border-radius:10px;margin-bottom:14px">`:''}<div class="detail-list">预估金额：${money(it.price)}${it.note?`<br>备注：${esc(it.note)}`:''}${it.url?`<br><a href="${esc(it.url)}" target="_blank" rel="noopener">查看购买链接 ↗</a>`:''}</div><button class="btn block" onclick="this.closest('.modal-bg').remove()">知道啦</button></div>`;document.body.append(bg)}
render();
</script></body></html>
